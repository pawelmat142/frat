events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server backend:3100;
    }

    server {
        listen 80;
        server_name frat.com.pl www.frat.com.pl localhost;

        root /usr/share/nginx/html;
        index index.html;

        # API routes - proxy to backend on port 3100
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # WebSocket - proxy to backend
        location /socket/ {
            proxy_pass http://backend/socket/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Hashed build output (JS/CSS/media) - safe to cache forever, filename changes on content change
        location /static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Non-hashed public assets (icons/img) - always revalidate so updated files are picked up
        location /assets/ {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Frontend static files - serve directly from nginx
        # index.html, manifest.json, sw.js, version.json etc. must never be cached,
        # so installed PWAs always fetch the latest shell and detect new versions
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
